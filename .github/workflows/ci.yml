# Checks: lint, types, unit and functional tests (the browser suite needs
# Playwright and stays local). Runs on every push and pull request, and is
# called by release.yml before building the production image.

name: CI

on:
  push:
    branches-ignore: [prod] # release.yml runs these checks itself
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paper
          POSTGRES_PASSWORD: paper
          POSTGRES_DB: paper_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U paper -d paper_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Environment
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=$(openssl rand -base64 32)|" .env

      # Tests first: `node ace` regenerates .adonisjs/ (routes, pages),
      # which the type check relies on.
      - name: Tests (unit, functional)
        run: node ace test unit functional

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
